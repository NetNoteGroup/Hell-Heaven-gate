<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hell &amp; Heaven Names List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<style>
:root{--bg:#f3f5f2;--card:#fff;--tx:#17211c;--mut:#5d6b63;--ac:#1f6f54;--acx:#fff;--bd:#d5dcd7;--dg:#b3261e;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#18211c;--tx:#e6eee9;--mut:#93a49a;--ac:#4fc197;--acx:#08140f;--bd:#2b3932;--dg:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101613;--card:#18211c;--tx:#e6eee9;--mut:#93a49a;--ac:#4fc197;--acx:#08140f;--bd:#2b3932;--dg:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,"Times New Roman",serif}
.w{max-width:620px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
p.s{color:var(--mut);margin:0 0 18px;font-size:.95rem}
input,textarea,button,select{font:inherit;color:inherit}
input[type=text],input[type=password],textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin:4px 0 12px}
textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
label{font-size:.9rem;color:var(--mut)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:8px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
button.d{color:var(--dg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar input{flex:1;min-width:140px;margin:0}
.e{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.e b{font-size:1.05rem}.e small{color:var(--mut);display:block;overflow-wrap:anywhere}
.pw{font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere;margin:6px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row button{padding:5px 10px;font-size:.85rem}
.box{background:var(--card);border:1px solid var(--ac);border-radius:10px;padding:14px;margin-bottom:14px}
.gen{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--mut);margin-bottom:12px}
.gen input[type=range]{flex:1;min-width:100px}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
#t.on{opacity:1}
.err{color:var(--dg);min-height:1.4em;margin:0 0 8px;font-size:.9rem}
.hide{display:none}
html{background:var(--bg)}
h1{font-family:"Cinzel",Georgia,serif;letter-spacing:.05em}
.art{display:block;margin:0 auto;max-width:100%;height:auto;mix-blend-mode:multiply}
.hero{max-height:min(74vh,620px);width:auto}
.ft{max-height:520px;width:auto;opacity:.9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .art{filter:invert(1);mix-blend-mode:screen}}
:root[data-theme="dark"] .art{filter:invert(1);mix-blend-mode:screen}
.cen{text-align:center}
.mm{font-style:italic;color:var(--mut);letter-spacing:.04em}
.lk{max-width:420px;margin:0 auto}
.bh{font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:1.3rem;letter-spacing:.3em;margin:18px 0 0;padding-left:.3em}
</style>
</head>

  catch(err){ie.textContent="Couldn’t open that. Check the pasted text and the master password."}}
});
